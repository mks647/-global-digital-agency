<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Admin Login</title><link rel="stylesheet" href="../css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 30px));background:#f1f0ea;color:#18212c;padding:30px;border-radius:18px}.box label{display:block;margin:12px 0 6px;font-size:12px}.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px}.box button{width:100%;margin-top:18px}</style><body><form class="box" id="login"><p class="eyebrow">APEX DEMO · ADMIN</p><h2 style="font-size:32px">Sign in</h2><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button class="button button-primary">Sign in ↗</button><p id="msg" role="status"></p><a href="/">← Back to website</a></form><script>document.querySelector("#login").onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),j=await r.json();if(r.ok)location.href="/admin";else document.querySelector("#msg").textContent=j.message||"Login failed"};</script></body></html>
