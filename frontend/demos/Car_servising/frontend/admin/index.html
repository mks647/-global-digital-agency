<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiries Admin</title><link rel="stylesheet" href="../css/styles.css"><style>.admin{width:min(1100px,calc(100% - 30px));margin:40px auto}.head{display:flex;justify-content:space-between;align-items:center}.wrap{overflow:auto;margin-top:25px}table{width:100%;border-collapse:collapse;background:#18212c}th,td{text-align:left;padding:12px;border-bottom:1px solid #34404d;font-size:12px}th{color:var(--lime)}select{padding:7px;border-radius:7px}</style><body><main class="admin"><div class="head"><div><p class="eyebrow">APEX DEMO · PRIVATE</p><h1 style="font-size:40px">Enquiries</h1></div><button id="logout" class="button button-outline">Log out</button></div><p id="status">Loading…</p><div class="wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Vehicle</th><th>Package</th><th>Message</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){let r=await fetch("/api/admin/enquiries");if(r.status===401){location.href="/admin/login";return}let d=await r.json();document.querySelector("#status").textContent=d.length+" enquiries";document.querySelector("#rows").innerHTML=d.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.vehicle)}</td><td>${esc(x.package)}</td><td>${esc(x.message)}</td><td><select data-id="${x.id}">${["New","Contacted","In progress","Completed","Archived"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("");document.querySelectorAll("select[data-id]").forEach(s=>s.onchange=()=>fetch("/api/admin/enquiries/"+s.dataset.id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s.value})}))}document.querySelector("#logout").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST"});location.href="/admin/login"};load();</script></body></html>
